# Generated by backend-skeleton (stack choice: postgres-dev-db). A LOCAL-ONLY Postgres for
# development -- never started automatically by bskel itself; run it via scripts/db-up.sh.
# `${VAR:-default}` below is Docker Compose's own env substitution syntax (single braces), not
# this project's own double-brace template syntax -- scripts/db-up.sh exports these before
# calling `docker compose up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bskel-postgres-dev-data:/var/lib/postgresql/data
volumes:
  bskel-postgres-dev-data:
