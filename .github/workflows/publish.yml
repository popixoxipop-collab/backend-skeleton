name: Publish to npm

# npm trusted publishing (OIDC) -- chosen over a long-lived NPM_TOKEN secret after repeated
# real-execution failures trying to complete npm's interactive WebAuthn/OTP flow through this
# CI/agent environment (`npm publish` -- even with a fresh access token -- kept demanding an
# EOTP the polling window never completed in time). npm's own account-settings UI (as of this
# workflow's authoring) is actively steering users away from 2FA-bypass tokens toward exactly
# this OIDC mechanism ("npm tokens that bypass 2FA are being restricted"), so this is both the
# fix for today's blocker and the durable, forward-compatible one -- no token to leak, rotate,
# or have expire.
#
# Requires a ONE-TIME manual step on npmjs.com that no CLI/API exposes (must be done in the
# package's own web settings, see this repo's release notes / DECISIONS.md for the exact values
# entered): backend-skeleton's "Publishing access" -> "Trusted Publisher" -> GitHub Actions,
# pointed at this exact repo + this exact workflow filename (`publish.yml`), no environment.
#
# `workflow_dispatch` only, deliberately -- NOT triggered on every push/tag. This project's
# release cadence is a manual, reviewed `chore(release): bump version to ...` commit (see git
# log), not an automatic "every merge to main ships a new version" model; auto-publishing here
# would be a materially different (and riskier) release policy this repo has never adopted.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish a new version, or promote-tag an already-published version (no republish -- npm rejects publishing an existing version anyway) onto a dist-tag like latest'
        required: true
        default: 'publish'
        type: choice
        options:
          - publish
          - promote-tag
      tag:
        description: 'npm dist-tag: publish mode = tag to publish under; promote-tag mode = tag to move'
        required: true
        default: 'beta'
      version:
        description: 'promote-tag mode only: exact version to retag, e.g. 1.0.0-beta.4 (ignored in publish mode)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # required for npm's OIDC trusted-publishing token exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Found live on this workflow's first real run: `npm test` shells out to `rg` directly
      # (throws, not degrades, without it -- same requirement ci.yml's own `test` job installs
      # this for) and ubuntu-latest does NOT ship it preinstalled. 263 unrelated-looking test
      # failures (`Command failed: which rg`) before this was added.
      - name: install ripgrep
        if: inputs.mode == 'publish'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # Trusted publishing needs npm >= 11.5.1 -- not guaranteed to be what setup-node's bundled
      # npm version happens to be, so pinned to latest explicitly rather than hoping.
      - run: npm install -g npm@latest
      - run: npm test
        if: inputs.mode == 'publish'
      # No NODE_AUTH_TOKEN/NPM_TOKEN anywhere in this workflow, deliberately -- with
      # id-token: write and the npm-side Trusted Publisher config above, `npm publish` obtains a
      # short-lived registry token itself via OIDC. Also generates real provenance attestation
      # (supply-chain verifiable back to this exact commit/workflow run), a capability a
      # long-lived token could never provide.
      - run: npm publish --tag "$NPM_DIST_TAG" --provenance
        if: inputs.mode == 'publish'
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
      # D-npm-publish-oidc: `npm dist-tag add` was added after `npm login`'s local session
      # expired outright (a plain 401, not an OTP prompt) while trying to move `latest` onto an
      # already-published beta.4 by hand -- defeats the entire point of having just set up
      # trusted publishing to avoid exactly this kind of local-auth friction. The npm-side
      # Trusted Publisher config only lists "Allow npm publish"/"Allow npm stage publish" as
      # explicit allowed actions (no separate dist-tag entry), so this was genuinely unverified
      # until run for real -- if it turns out the OIDC token this grants doesn't cover
      # `dist-tag add`, the real fix is a distinct trusted-publisher-covered action, not silently
      # falling back to a local token.
      - run: npm dist-tag add "backend-skeleton@$PROMOTE_VERSION" "$NPM_DIST_TAG"
        if: inputs.mode == 'promote-tag'
        env:
          PROMOTE_VERSION: ${{ inputs.version }}
          NPM_DIST_TAG: ${{ inputs.tag }}
