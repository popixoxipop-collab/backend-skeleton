name: Rails target-scope one-shot evidence
on:
  push:
    branches:
      - ci/rails-scope-evidence-20261025-v1
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Rails source
        uses: actions/checkout@v4
        with:
          ref: 7a383139203362e3ec64dc8b1550ae847246e937
          fetch-depth: 0
          persist-credentials: false
      - name: Install ripgrep for scanner parity
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "7a383139203362e3ec64dc8b1550ae847246e937"
      - name: Install dependencies
        run: npm ci
      - name: Generate source-bound Rails evidence
        run: |
          node --test adapters/http/ruby-rails/target-scope.test.mjs adapters/http/ruby-rails/target-scope-negative.test.mjs
          node --test adapters/http/ruby-rails/scope-evidence.test.mjs
          node adapters/http/ruby-rails/scope-evidence.mjs --check
      - name: Verify committed receipt SHA-256
        run: sha256sum adapters/http/ruby-rails/SCOPE_EVIDENCE.json
