name: CI

# D-fixture-corpus (P3): `paths-ignore: **/*.md` -- found live, not anticipated: a docs-only
# commit (DECISIONS.md) still triggered a full 4-job run on this repo's very first real CI usage.
# WHY: doc-only changes touch nothing `npm test`/the java-compile fixture/the packaged tarball
# could regress -- running the full matrix for them is pure cost with no verification value.
# COST: a commit that mixes a .md change with real code still runs CI (paths-ignore only skips
# when EVERY changed file matches), so this never hides a code change behind a docs commit.
# EXIT: remove these two `paths-ignore` blocks if a doc file ever needs to be part of a
# runtime-verified path (e.g. a lint step that checks README.md's own code samples).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  # D-greenfield-parameters (P2b): `bskel new --stack spring`'s own local validators (group-id,
  # package-name, java-version) exist specifically because start.spring.io's live behavior is
  # measured, point-in-time evidence, not a stable contract -- javaVersion=99 returning HTTP 200
  # today doesn't mean it always will, and vice versa. A daily, non-blocking canary (spring-
  # initializr-canary job below) re-runs that same real scaffold-and-compile against the live
  # service so drift shows up as a scheduled-run failure, not silently inside someone's PR.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # D-fixture-corpus (P3): Linux only, Node 22 + 24 -- NOT the documented floor (lib/doctor.mjs's
  # MIN_NODE, 20.11.0). That exact patch has a real, already-upstream-fixed Node core bug
  # (execFileSync truncates a captured child stdout at exactly 8192 bytes on this specific
  # release), confirmed by direct execution during this item's own grounding, unrelated to this
  # codebase. Testing it here would make CI permanently red for a reason no one could fix from
  # this repo. Real-world callers get whatever patch a version manager resolves "20.x" to, never
  # the literal first-ever 20.11.0 build -- see DECISIONS.md's D-fixture-corpus for the full
  # evidence and for why macOS is deliberately NOT in this matrix (private-repo Actions runners
  # bill macOS at 10x Linux; this codebase has, so far, only ever been run on macOS locally, so a
  # macOS CI job would mostly re-test the one platform already exercised daily -- Linux is the
  # actually-unverified platform).
  # D-handles-providers (G4) follow-up: test/handles-java-codec.test.mjs needs a real javac/java
  # to close the JS<->Java "byte-identical" codec verification gap this repo's own DECISIONS.md
  # flagged as still open. Unlike java-compile/java-integration/java-ast below, this needs no
  # Gradle and no network -- pure java.* stdlib, a two-file `javac` + one `java -cp` invocation,
  # sub-second -- cheap enough to run in the fast job on every push/PR, the same bar python3
  # already clears for the sibling Python codec test in this same job.
  # W7: this job (and the 8 below it through java-integration) now run on the self-hosted
  # `macstudio` runner for push(main)/schedule/workflow_dispatch, and stay on GitHub-hosted
  # ubuntu-latest for pull_request -- UNCHANGED there, zero new exposure. Found live, not
  # theoretical: during the real 2026-08-26/27 GitHub Actions billing outage, every ubuntu-latest
  # job in this file failed with "recent account payments have failed" while the ALREADY-
  # self-hosted `macos` job below (unaffected -- self-hosted execution isn't billed the same way)
  # succeeded in the same run. `pull_request` is deliberately excluded from ever reaching
  # `macstudio` here -- see the `macos` job's own SECURITY comment below for the full reasoning
  # (a self-hosted runner reachable from `pull_request` runs the PR's own arbitrary code on the
  # user's personal, always-on machine); this ternary keeps that exact same boundary while adding
  # billing-outage resilience for push-to-main, which only an already-trusted pusher can trigger.
  # `sudo apt-get install ripgrep` stays, but now gated `if: runner.os != 'macOS'` -- macstudio
  # already has `rg` on PATH via the runner's own `.env` file (same as the `macos` job never
  # needing this step), but `pull_request` still resolves to ubuntu-latest, which genuinely needs
  # apt's own ripgrep install. An earlier version of this change dropped the step outright,
  # silently breaking every pull_request run the moment it merged -- caught by a real
  # workflow_dispatch run, not by inspection; kept as a cautionary note for the next reader.
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test

  # W7: see the `test` job's own comment above for the full pull_request/push runs-on design.
  package-install:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # D-fixture-corpus (P3): test/package-install.test.mjs runs `bskel doctor --json` inside a
      # real git repo -- `rg` is a required check there (unscoped doctor, same as scan/handles),
      # so this job needs it even though it never runs `bskel scan`/`bskel handles` itself. Found
      # live: this step was missing on the first real CI run, and the job failed exactly here.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:pack

  # D-fixture-corpus (P3): the first automated proof that `bskel handles emit`'s generated Java
  # actually compiles -- previously a one-time manual run, narrated in DECISIONS.md, on this one
  # machine, with a hand-symlinked JDK17 toolchain. See scripts/java-compile-smoke.mjs.
  # W7: see the `test` job's own comment above for the full pull_request/push runs-on design.
  java-compile:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # D-fixture-corpus (P3): scripts/java-compile-smoke.mjs runs a real `bskel scan`, which
      # shells out to `rg` directly (throws, not degrades, without it). Missing here on the first
      # real CI run -- found live (`spawnSync rg ENOENT`).
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:java-compile

  # P3b (D-python-import-check): the other half of P3's own "macOS runner + Python codegen
  # import-check" deferral. Same shape as java-compile above (dedicated job for a heavier,
  # network-touching check kept out of the fast `test` job's default `npm test` path) -- installs
  # fastapi+sqlmodel into a throwaway venv and imports every file `bskel handles emit` generates
  # for real, not just `ast.parse`s them. See scripts/python-import-smoke.mjs.
  # W7: see the `test` job's own comment above for the full pull_request/push runs-on design.
  python-import:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # W7: actions/setup-python's precompiled macOS release tarballs have `/Users/runner`
      # (GitHub-hosted macOS runners' fixed username) baked into their own install script at
      # build time -- found live: a real workflow_dispatch run against macstudio failed with
      # `mkdir: /Users/runner: Permission denied`, since this runner's real user is `eoe`. Not
      # fixable via RUNNER_TOOL_CACHE or any other env var -- the path is inside the downloaded
      # release asset itself. Homebrew's own python@3.12 (already installed on macstudio,
      # verified with a real `python3 -m venv` round-trip) is used instead via a job-temp shim
      # dir prepended to PATH -- `python3` unqualified is what scripts/python-import-smoke.mjs
      # hardcodes, and Homebrew's default unversioned `python3` symlink currently points at
      # python@3.11, not the `3.12` this job declares, so the shim (not just adding
      # python@3.12/bin to PATH) is what makes the resolved version match the declared one.
      - name: point python3 at Homebrew's python@3.12 (macOS self-hosted only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/py312-shim"
          ln -sf /opt/homebrew/opt/python@3.12/bin/python3.12 "$RUNNER_TEMP/py312-shim/python3"
          echo "$RUNNER_TEMP/py312-shim" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.12'
      # scripts/python-import-smoke.mjs runs a real `bskel scan`, same rg requirement as the other
      # jobs above.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:python-import

  # D-typescript-express-provider (G5): the third dedicated codegen-verification job, alongside
  # java-compile/python-import above. Genuinely cheaper to set up than either -- no JVM/Gradle, no
  # Python venv, just `npm install` into the SCRATCH repo's own node_modules (Node is already this
  # whole CLI's own runtime, so no extra setup-* action is even needed beyond checkout). Runs a real
  # `npx tsc --noEmit` against generated code -- unlike Python (dynamically typed, where a real
  # import already proves the meaningful thing), TypeScript's whole value proposition IS its
  # compiler. See scripts/typescript-typecheck-smoke.mjs.
  # W7: see the `test` job's own comment above for the full pull_request/push runs-on design.
  typescript-compile:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # scripts/typescript-typecheck-smoke.mjs runs a real `bskel scan`, same rg requirement as the
      # other jobs above.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:typescript-compile

  # A4 (D-db-schema-plane): the first automated proof that Plane C (live Postgres introspection)
  # actually works against a real database -- previously verified only once, by hand, against a
  # local Homebrew Postgres. Same dedicated-job shape as java-compile/python-import above (a
  # real, network/service-touching check kept out of the fast `test` job's default `npm test`
  # path).
  # W7: see the `test` job's own comment above for the full pull_request/push runs-on design.
  # GitHub Actions' native `services:` container -- used here through the D-fixture-corpus/A4
  # eras -- is Linux-only ("Container operations are only supported on Linux runners"); a real
  # workflow_dispatch run against macstudio failed immediately with exactly that error the first
  # time this job was pointed at the self-hosted path, disproving an earlier version of this
  # comment that (wrongly, never actually exercised) claimed the services: block "works unchanged"
  # there. Docker itself is NOT the blocker -- colima (`brew install colima docker`, `colima
  # start`) genuinely provides a working daemon on macstudio, proven by a real `docker run
  # postgres:16 ... pg_isready` round-trip -- only GitHub's own services: orchestration is
  # Linux-only. Replaced with the steps below: a plain `docker run`/health-poll/`docker rm -f`
  # sequence that reimplements what services: automated, using nothing but the `docker` CLI --
  # this works identically on ubuntu-latest's own preinstalled Docker and macstudio's
  # colima-provided one, so (unlike runs-on) this needs no OS branching at all. The runner's own
  # `.env` gained `DOCKER_HOST=unix:///Users/eoe/.colima/default/docker.sock` since colima's
  # socket isn't at the standard `/var/run/docker.sock` path.
  db-introspect:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # scripts/db-introspect-smoke.mjs runs a real `bskel scan`, same rg requirement as the
      # other smoke-test jobs above.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # POSTGRES_HOST_AUTH_METHOD=trust -- this container is disposable, network-isolated to this
      # one job's lifetime, and never holds anything but throwaway test tables, so it deliberately
      # carries NO password at all rather than a hardcoded one (the official postgres image
      # supports this exact mode for precisely this case -- avoids a credential-shaped string in
      # this file entirely, not just a low-stakes one).
      - name: start postgres
        run: |
          docker run -d --name bskel-pg-a4 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=bskel_a4_test \
            -p 5432:5432 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec bskel-pg-a4 pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1
      - run: npm ci
      - run: npm run test:db-introspect
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bskel_a4_test
      - name: stop postgres
        if: always()
        run: docker rm -f bskel-pg-a4

  # D-write-safety-phase1 (item 3): real-Postgres proof that `handles audit --check-registry-coverage`
  # actually answers "is this resource type registered" against a real database -- same shape as
  # db-introspect above (no Gradle/Java setup needed, scripts/handles-registry-coverage-smoke.mjs
  # never compiles anything, only scans + a real `bskel handles emit`), own DB name so it can't
  # collide with a job running in the same container lifecycle.
  registry-coverage:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: start postgres
        run: |
          docker run -d --name bskel-pg-registry-coverage \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=bskel_registry_coverage_test \
            -p 5432:5432 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec bskel-pg-registry-coverage pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1
      - run: npm ci
      - run: npm run test:registry-coverage
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bskel_registry_coverage_test
      - name: stop postgres
        if: always()
        run: docker rm -f bskel-pg-registry-coverage

  # D-ddl-apply: the first automated, real-Postgres proof of the `ddl-apply` patch-transaction kind
  # (propose/approve/apply/confirm, a TOCTOU race, a rollback refusal, a CONCURRENTLY refusal, all
  # over both the real CLI and a real HTTP round trip against `bskel serve --database-url-env`).
  # Own container name/DB name/host port (`bskel-pg-ddl-apply`/`bskel_ddl_apply_test`/5433) --
  # deliberately distinct from db-introspect's own (`bskel-pg-a4`/`bskel_a4_test`/5432) so the two
  # jobs never collide even if ever run in parallel on the same self-hosted runner. Same
  # runs-on/manual-docker-lifecycle shape as db-introspect above -- see that job's own comment for
  # why services: isn't used (macOS-incompatible). No ripgrep install here -- unlike
  # db-introspect-smoke.mjs, this script never calls `bskel scan`.
  ddl-apply:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: start postgres
        run: |
          docker run -d --name bskel-pg-ddl-apply \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=bskel_ddl_apply_test \
            -p 5433:5432 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec bskel-pg-ddl-apply pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1
      - run: npm ci
      - run: npm run test:ddl-apply
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5433/bskel_ddl_apply_test
      - name: stop postgres
        if: always()
        run: docker rm -f bskel-pg-ddl-apply

  # D-cross-feature-fk-inference: the first automated, real-Postgres proof that the new
  # `db_foreign_key` cross-feature signal correlates a REAL live FK edge to the two features that
  # own each side's table. Own container name/DB name/host port (`bskel-pg-cf-fk`/
  # `bskel_cf_fk_test`/5434) -- distinct from db-introspect's (5432) and ddl-apply's (5433) so none
  # of the three ever collide even if run in parallel on the same self-hosted runner. Same
  # runs-on/manual-docker-lifecycle shape as those two jobs -- see db-introspect's own comment above
  # for why services: isn't used (macOS-incompatible). Ripgrep IS needed here (unlike ddl-apply) --
  # this smoke script's own establishThroughContract() calls a real `bskel scan`.
  cross-feature-fk:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: start postgres
        run: |
          docker run -d --name bskel-pg-cf-fk \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=bskel_cf_fk_test \
            -p 5434:5432 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec bskel-pg-cf-fk pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1
      - run: npm ci
      - run: npm run test:cross-feature-fk
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5434/bskel_cf_fk_test
      - name: stop postgres
        if: always()
        run: docker rm -f bskel-pg-cf-fk

  # G4 follow-up (D-handles-providers): the first automated proof that python-fastapi's own
  # handle read/snapshot lifecycle (register -> a decorated service function -> a real HTTP GET
  # recover) actually works against a real, disposable Postgres -- the Python-ecosystem
  # equivalent of java-integration below, using FastAPI's own TestClient (real in-process ASGI
  # request/response cycles, no bound port) instead of a live server + real HTTP client, since
  # nothing here needs what only a live-bound-port test proves (unlike Java's own TestRestTemplate
  # PATCH limitation). Same db-introspect-style disposable Postgres service container, own DB name.
  # W7: see the `test`/`db-introspect` jobs' own comments above for the runs-on design and why
  # `services:` was replaced with a manual docker run/health-poll/cleanup sequence -- GitHub's
  # services: orchestration is Linux-only, not something colima's real Docker daemon can fix.
  python-integration:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # W7: see the `python-import` job's own comment above -- actions/setup-python's macOS
      # release cannot relocate off `/Users/runner`, so this uses the same Homebrew
      # python@3.12-via-job-temp-shim approach instead of setup-python on macOS.
      - name: point python3 at Homebrew's python@3.12 (macOS self-hosted only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/py312-shim"
          ln -sf /opt/homebrew/opt/python@3.12/bin/python3.12 "$RUNNER_TEMP/py312-shim/python3"
          echo "$RUNNER_TEMP/py312-shim" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: '3.12'
      # scripts/python-integration-smoke.mjs runs a real `bskel scan`, same rg requirement as the
      # other smoke-test jobs above.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: start postgres
        run: |
          docker run -d --name bskel-pg-g4 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=bskel_g4_python_test \
            -p 5432:5432 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec bskel-pg-g4 pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1
      - run: npm ci
      - run: npm run test:python-integration
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bskel_g4_python_test
      - name: stop postgres
        if: always()
        run: docker rm -f bskel-pg-g4

  # A2 Phase 2 (D-java-ast-helper): the first automated, clean-checkout proof that the bundled
  # JavaParser + Symbol Solver helper (handles/providers/java-spring/ast-helper/) actually builds
  # and runs -- previously verified only by hand, on the development machine's own already-warm
  # Gradle cache. Same dedicated-job shape as java-compile/java-integration above (a real,
  # network-touching check kept out of the fast `test` job's default `npm test` path). Unlike
  # java-compile, this job's Gradle wrapper is already COMMITTED (it ships inside the npm package
  # for real consumers) -- no `gradle/actions/setup-gradle` needed for correctness, only kept for
  # its dependency-cache speedup between runs. See scripts/java-ast-smoke.mjs.
  # W7: see the `test` job's own comment above for the full pull_request/push runs-on design.
  java-ast:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # scripts/java-ast-smoke.mjs runs a real `bskel scan`, same rg requirement as the other
      # smoke-test jobs above.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:java-ast

  # O4 (D-handle-lifecycle): the deepest verification this project has attempted -- a genuinely
  # running Spring Boot app, real HTTP calls (register -> PATCH -> HandleAspect fires -> GET
  # recover), against a real disposable Postgres. Own dedicated job (not folded into
  # java-compile above) because it needs BOTH a JVM toolchain AND a database service container,
  # and actually runs `./gradlew test`, not just `compileJava` -- a materially heavier/slower
  # check than either existing job alone. Same `POSTGRES_HOST_AUTH_METHOD: trust`, no-password
  # convention as db-introspect above; own DB name (bskel_o4_test) so this job and db-introspect/
  # python-integration could never collide even if a future change ran them concurrently.
  # W7: see the `test`/`db-introspect` jobs' own comments above for the runs-on design and why
  # `services:` was replaced with a manual docker run/health-poll/cleanup sequence -- GitHub's
  # services: orchestration is Linux-only, not something colima's real Docker daemon can fix.
  # This job (already the heaviest -- a real `./gradlew test`) is exactly the kind of check most
  # worth insulating from a hosted-runner billing outage.
  java-integration:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","macstudio"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # scripts/java-integration-smoke.mjs runs a real `bskel scan`, same rg requirement as the
      # other smoke-test jobs above.
      # W7: gated `if: runner.os != 'macOS'` -- see the `test` job's own comment above.
      - name: install ripgrep
        if: runner.os != 'macOS'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: start postgres
        run: |
          docker run -d --name bskel-pg-o4 \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -e POSTGRES_DB=bskel_o4_test \
            -p 5432:5432 \
            postgres:16
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            docker exec bskel-pg-o4 pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          exit 1
      - run: npm ci
      - run: npm run test:java-integration
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bskel_o4_test
      - name: stop postgres
        if: always()
        run: docker rm -f bskel-pg-o4

  # D-macos-runner (P3b): P3's own comment on the `test` job above said a macOS job "would mostly
  # re-test the one platform already exercised daily" locally -- true, but automated + repeatable
  # beats "exercised daily by whoever happens to be at their Mac" all the same, and P3 deferred it
  # ONLY on cost grounds (GitHub-hosted macOS bills at 10x Linux on this private repo). Self-hosted
  # runners are unmetered/free regardless of OS (GitHub tried billing them in Dec 2025, reversed
  # within 48h -- still free as of this job's authoring).
  #
  # Update (2026-08-24): originally ran on `bob-macmini` (the user's idle Mac mini). That runner's
  # launchd service was deliberately stopped for unrelated maintenance and never came back online,
  # stalling a real main-push CI run -- migrated to `macstudio` (the user's Mac Studio, already the
  # trusted/primary machine for other repos per this user's own infra conventions) for the same
  # zero-cost reason, on a machine that stays up more consistently. Toolchain parity re-verified by
  # hand on the new host (brew install node/ripgrep/openjdk@17/gradle, same set P3b originally
  # grounded), and a `.env` file was added to the runner's install directory
  # (`PATH=/opt/homebrew/bin:/opt/homebrew/opt/openjdk@17/bin:...`) because a launchd-started
  # runner service does NOT source `~/.zprofile` -- without it `rg` (this job's one real,
  # un-guarded-by-setup-* dependency, see below) would silently not be found.
  #
  # SECURITY (caught by automated post-push review on this job's first commit, fixed same-PR
  # before merge): a self-hosted runner must NEVER be reachable from `pull_request` -- that event
  # (unlike `pull_request_target`) checks out and runs the PR HEAD's own workflow/test-script
  # content, so anyone able to open a PR could run arbitrary code directly on the user's personal,
  # always-on Mac mini (GitHub's own self-hosted-runner hardening guide flags exactly this
  # combination as unsafe). `if: github.event_name != 'pull_request'` makes this job a no-op on
  # PRs -- only `push`(main)/`workflow_dispatch`, i.e. only someone who can already push to main
  # (already fully trusted), can cause anything to execute here. The job still appears (skipped,
  # non-blocking) on PR checks so this file's own CI-workflow tests stay accurate.
  # Residual risk, accepted for now: the runner's `_work` directory is NOT wiped between jobs
  # (only actions/checkout's own `clean: true`, the default, resets the tracked repo dir) -- a
  # compromised push to main could still leave state for the next job to find. Not mitigated here
  # (would need `--ephemeral` runner mode, a bigger operational change); flagged, not silently
  # decided away -- revisit if this repo ever gains a second committer.
  # `runs-on` includes the custom `macstudio` label (set at runner registration, alongside the
  # auto-added `self-hosted`/`macOS`/`ARM64`) so this job can only ever be picked up by this one
  # specific machine, not any other self-hosted runner that happens to register with just the
  # generic `self-hosted`+`macOS` labels this repo might add later.
  # `timeout-minutes` is set explicitly (unlike the ephemeral ubuntu-latest jobs above) because a
  # hung job on a persistent self-hosted runner blocks that runner from picking up the NEXT job
  # indefinitely, instead of just timing out with the disposable VM at the platform default.
  macos:
    runs-on: [self-hosted, macOS, macstudio]
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # Same reasoning as the `test` job above -- this job also runs bare `npm test`, and
      # test/handles-java-codec.test.mjs is mandatory there too. Added explicitly rather than
      # assumed present: a self-hosted runner's launchd/service PATH can differ from an
      # interactive login shell's PATH even when a JDK is installed on the machine (a known
      # macOS/Homebrew/SDKMAN gotcha) -- setup-java is idempotent and removes that ambiguity
      # outright instead of hoping the daemon's PATH happens to include javac.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test

  # D-greenfield-parameters (P2b): the ONLY job in this workflow that talks to a live external
  # service -- deliberately kept off the push/PR path (`npm test`'s own start.spring.io coverage
  # is entirely mocked-fetch, matching D-greenfield-bootstrap's "CI must not hit an external
  # service" rule) and run on a schedule instead, so drift in Initializr's own behavior surfaces
  # as a scheduled-run failure someone notices, not a silent gap in what CI actually proves.
  # Never blocks a PR: `schedule`/`workflow_dispatch` only, via the `if:` below.
  spring-initializr-canary:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # java-version here MUST match scripts/spring-initializr-canary.mjs's own hardcoded
      # --java-version -- found live, not anticipated: the script requests a real, non-default
      # Java version (21) specifically to exercise P2b's on-demand start.spring.io metadata
      # fetch, and Gradle's own toolchain resolution genuinely fails closed (a clean, correct
      # "Cannot find a Java installation... matching {languageVersion=21}" error, not a bskel bug)
      # if the requested toolchain isn't actually installed on the runner. If the canary script's
      # own --java-version value ever changes, this must change with it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:spring-initializr-canary
