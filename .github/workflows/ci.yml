name: CI

# D-fixture-corpus (P3): `paths-ignore: **/*.md` -- found live, not anticipated: a docs-only
# commit (DECISIONS.md) still triggered a full 4-job run on this repo's very first real CI usage.
# WHY: doc-only changes touch nothing `npm test`/the java-compile fixture/the packaged tarball
# could regress -- running the full matrix for them is pure cost with no verification value.
# COST: a commit that mixes a .md change with real code still runs CI (paths-ignore only skips
# when EVERY changed file matches), so this never hides a code change behind a docs commit.
# EXIT: remove these two `paths-ignore` blocks if a doc file ever needs to be part of a
# runtime-verified path (e.g. a lint step that checks README.md's own code samples).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # D-fixture-corpus (P3): Linux only, Node 22 + 24 -- NOT the documented floor (lib/doctor.mjs's
  # MIN_NODE, 20.11.0). That exact patch has a real, already-upstream-fixed Node core bug
  # (execFileSync truncates a captured child stdout at exactly 8192 bytes on this specific
  # release), confirmed by direct execution during this item's own grounding, unrelated to this
  # codebase. Testing it here would make CI permanently red for a reason no one could fix from
  # this repo. Real-world callers get whatever patch a version manager resolves "20.x" to, never
  # the literal first-ever 20.11.0 build -- see DECISIONS.md's D-fixture-corpus for the full
  # evidence and for why macOS is deliberately NOT in this matrix (private-repo Actions runners
  # bill macOS at 10x Linux; this codebase has, so far, only ever been run on macOS locally, so a
  # macOS CI job would mostly re-test the one platform already exercised daily -- Linux is the
  # actually-unverified platform).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm test

  package-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # D-fixture-corpus (P3): test/package-install.test.mjs runs `bskel doctor --json` inside a
      # real git repo -- `rg` is a required check there (unscoped doctor, same as scan/handles),
      # so this job needs it even though it never runs `bskel scan`/`bskel handles` itself. Found
      # live: this step was missing on the first real CI run, and the job failed exactly here.
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:pack

  # D-fixture-corpus (P3): the first automated proof that `bskel handles emit`'s generated Java
  # actually compiles -- previously a one-time manual run, narrated in DECISIONS.md, on this one
  # machine, with a hand-symlinked JDK17 toolchain. See scripts/java-compile-smoke.mjs.
  java-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # D-fixture-corpus (P3): scripts/java-compile-smoke.mjs runs a real `bskel scan`, which
      # shells out to `rg` directly (throws, not degrades, without it). Missing here on the first
      # real CI run -- found live (`spawnSync rg ENOENT`).
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:java-compile

  # P3b (D-python-import-check): the other half of P3's own "macOS runner + Python codegen
  # import-check" deferral. Same shape as java-compile above (dedicated job for a heavier,
  # network-touching check kept out of the fast `test` job's default `npm test` path) -- installs
  # fastapi+sqlmodel into a throwaway venv and imports every file `bskel handles emit` generates
  # for real, not just `ast.parse`s them. See scripts/python-import-smoke.mjs.
  python-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # scripts/python-import-smoke.mjs runs a real `bskel scan`, same rg requirement as the other
      # jobs above.
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:python-import

  # A4 (D-db-schema-plane): the first automated proof that Plane C (live Postgres introspection)
  # actually works against a real database -- previously verified only once, by hand, against a
  # local Homebrew Postgres. Same dedicated-job shape as java-compile/python-import above (a
  # real, network/service-touching check kept out of the fast `test` job's default `npm test`
  # path). GitHub Actions' native `services:` container is a disposable Postgres for exactly this
  # job's lifetime -- not a persistent/shared instance, nothing to clean up afterward.
  db-introspect:
    runs-on: ubuntu-latest
    services:
      # POSTGRES_HOST_AUTH_METHOD: trust -- this container is disposable, network-isolated to
      # this one job's lifetime, and never holds anything but throwaway test tables, so it
      # deliberately carries NO password at all rather than a hardcoded one (the official
      # postgres image supports this exact mode for precisely this case -- avoids a
      # credential-shaped string in this file entirely, not just a low-stakes one).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bskel_a4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      # scripts/db-introspect-smoke.mjs runs a real `bskel scan`, same rg requirement as the
      # other smoke-test jobs above.
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:db-introspect
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bskel_a4_test

  # O4 (D-handle-lifecycle): the deepest verification this project has attempted -- a genuinely
  # running Spring Boot app, real HTTP calls (register -> PATCH -> HandleAspect fires -> GET
  # recover), against a real disposable Postgres. Own dedicated job (not folded into
  # java-compile above) because it needs BOTH a JVM toolchain AND a database service container,
  # and actually runs `./gradlew test`, not just `compileJava` -- a materially heavier/slower
  # check than either existing job alone. Same `POSTGRES_HOST_AUTH_METHOD: trust`, no-password
  # convention as db-introspect above; own DB name (bskel_o4_test) so a future re-run of both
  # jobs concurrently on self-hosted infra could never collide.
  java-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bskel_o4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # scripts/java-integration-smoke.mjs runs a real `bskel scan`, same rg requirement as the
      # other smoke-test jobs above.
      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run test:java-integration
        env:
          BSKEL_TEST_DATABASE_URL: postgres://postgres@localhost:5432/bskel_o4_test

  # D-macos-runner (P3b): P3's own comment on the `test` job above said a macOS job "would mostly
  # re-test the one platform already exercised daily" locally -- true, but automated + repeatable
  # beats "exercised daily by whoever happens to be at their Mac" all the same, and P3 deferred it
  # ONLY on cost grounds (GitHub-hosted macOS bills at 10x Linux on this private repo). `bob-macmini`
  # is a self-hosted runner on the user's own idle Mac mini, and self-hosted runners are
  # unmetered/free regardless of OS (GitHub tried billing them in Dec 2025, reversed within 48h --
  # still free as of this job's authoring).
  #
  # SECURITY (caught by automated post-push review on this job's first commit, fixed same-PR
  # before merge): a self-hosted runner must NEVER be reachable from `pull_request` -- that event
  # (unlike `pull_request_target`) checks out and runs the PR HEAD's own workflow/test-script
  # content, so anyone able to open a PR could run arbitrary code directly on the user's personal,
  # always-on Mac mini (GitHub's own self-hosted-runner hardening guide flags exactly this
  # combination as unsafe). `if: github.event_name != 'pull_request'` makes this job a no-op on
  # PRs -- only `push`(main)/`workflow_dispatch`, i.e. only someone who can already push to main
  # (already fully trusted), can cause anything to execute here. The job still appears (skipped,
  # non-blocking) on PR checks so this file's own CI-workflow tests stay accurate.
  # Residual risk, accepted for now: the runner's `_work` directory is NOT wiped between jobs
  # (only actions/checkout's own `clean: true`, the default, resets the tracked repo dir) -- a
  # compromised push to main could still leave state for the next job to find. Not mitigated here
  # (would need `--ephemeral` runner mode, a bigger operational change); flagged, not silently
  # decided away -- revisit if this repo ever gains a second committer.
  # `runs-on` includes the custom `bob-macmini` label (set at runner registration, alongside the
  # auto-added `self-hosted`/`macOS`) so this job can only ever be picked up by this one specific
  # machine, not any other self-hosted runner that happens to register with just the generic
  # `self-hosted`+`macOS` labels this repo might add later.
  # `timeout-minutes` is set explicitly (unlike the ephemeral ubuntu-latest jobs above) because a
  # hung job on a persistent self-hosted runner blocks that runner from picking up the NEXT job
  # indefinitely, instead of just timing out with the disposable VM at the platform default.
  macos:
    runs-on: [self-hosted, macOS, bob-macmini]
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm test
