// P3 (D-fixture-corpus): the fixture `bskel handles emit` writes generated Java into for CI's
// java-compile job (scripts/java-compile-smoke.mjs). Unlike test/fixtures/java-spring/, this one
// IS actually built -- `./gradlew compileJava` -- via `bskel verify --feature ... --build`, which
// exercises lib/verify.mjs::detectBuildCommand()'s real ./gradlew path end-to-end, not a fake
// stub script the way test/verify-cli.test.mjs's own fixtures do.
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.example'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	compileOnly 'org.projectlombok:lombok:1.18.32'
	annotationProcessor 'org.projectlombok:lombok:1.18.32'
	runtimeOnly 'com.h2database:h2'
}
